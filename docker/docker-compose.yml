# ============================================================
# FitMind AI 智能健身平台 —— 中间件编排
# ------------------------------------------------------------
# 启动：cd docker && docker-compose -p fitmind up -d
# 停止：docker-compose -p fitmind down
# 状态：docker-compose -p fitmind ps
#
# 说明：
#   1. MySQL 不在此编排内，直接复用宿主机 MySQL 8.0.41 (localhost:3306)
#   2. Elasticsearch 映射到宿主机 9201，因为 9200 已被 Cpolar 占用
#   3. XXL-JOB 推迟到 M3、Milvus 推迟到 M7 再加
#   4. 所有数据用命名卷持久化，避免 Windows 绑定挂载的权限问题
# ============================================================

services:

  # -------------------- Redis --------------------
  redis:
    image: redis:7.2-alpine
    container_name: fm-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - fm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fm-net

  # -------------------- Nacos 注册与配置中心 --------------------
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: fm-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "${NACOS_PORT}:8848"       # 控制台 / HTTP API
      - "${NACOS_GRPC_PORT}:9848"  # 客户端 gRPC
      - "${NACOS_GRPC_PORT_2}:9849" # 服务间 gRPC
    volumes:
      - fm-nacos-logs:/home/nacos/logs
    networks:
      - fm-net

  # -------------------- RabbitMQ 消息队列 --------------------
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: fm-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "${RABBITMQ_PORT}:5672"           # AMQP
      - "${RABBITMQ_CONSOLE_PORT}:15672"  # 管理台
    volumes:
      - fm-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - fm-net

  # -------------------- MinIO 对象存储（训练视频） --------------------
  # 复用本机已有的 minio 镜像，省一次下载
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: fm-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT}:9001"   # 控制台
    volumes:
      - fm-minio-data:/data
    networks:
      - fm-net

  # -------------------- Elasticsearch 搜索 / 向量库 --------------------
  elasticsearch:
    image: elasticsearch:7.17.22
    container_name: fm-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: ${ES_JAVA_OPTS}
      xpack.security.enabled: "false"
      bootstrap.memory_lock: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${ES_PORT}:9200"
    volumes:
      - fm-es-data:/usr/share/elasticsearch/data
      # ★ 插件目录持久化。
      #   为什么：docker exec 装的插件写在容器可写层，容器一被 recreate 就没了
      #   （改配置、down/up 都会 recreate）。实测重建后 ik_max_word 直接报
      #   "failed to find global analyzer"。
      - fm-es-plugins:/usr/share/elasticsearch/plugins
      # ★ IK 自带词库目录（约 8MB：main.dic / extra_*.dic / preposition.dic）也要持久化。
      #   为什么：插件安装时会把官方词库释放到 config/analysis-ik/，那也在容器可写层。
      #   只持久化 plugins/ 而不管 config/ 的话，容器一删插件在、词库没了，
      #   表现为 _analyze 报 NPE「_StopWords is null」——比插件丢失更隐蔽。
      - fm-es-ik-config:/usr/share/elasticsearch/config/analysis-ik
      # ★ 健身领域自定义词典：直接绑项目里的文件，改完 restart 就生效，且进版本管理。
      #   注意这两个 bind 要放在上面的命名卷之后，保证是"卷里的目录 + 卷内某个体"的嵌套顺序。
      - type: bind
        source: ./ik/IKAnalyzer.cfg.xml
        target: /usr/share/elasticsearch/config/analysis-ik/IKAnalyzer.cfg.xml
      - type: bind
        source: ./ik/fitmind.dic
        target: /usr/share/elasticsearch/config/analysis-ik/fitmind.dic
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - fm-net

  # -------------------- XXL-JOB 调度中心（M3-1） --------------------
  # 为什么引入：@Scheduled 在多实例下会重复执行，XXL-JOB 天然解决路由策略、
  # 失败重试与分片广播（M3-2 积分榜月度结算要用分片广播并行落库）。
  # 复用宿主机 MySQL（host.docker.internal），凭据与业务服务一致。
  # 建表脚本：sql/xxl_job/tables_xxl_job.sql（执行器与任务已 INSERT 预置，免人工配置）。
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.3.1
    container_name: fm-xxljob
    restart: unless-stopped
    environment:
      PARAMS: >-
        --server.servlet.context-path=/xxl-job-admin
        --spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/xxl_job?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        --spring.datasource.username=${MYSQL_USERNAME}
        --spring.datasource.password=${MYSQL_PASSWORD}
        --xxl.job.accessToken=${XXL_JOB_TOKEN}
    ports:
      - "${XXL_ADMIN_PORT}:8080"
    volumes:
      - fm-xxljob-logs:/data/applogs
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/xxl-job-admin/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - fm-net

# -------------------- 网络与数据卷 --------------------
networks:
  fm-net:
    driver: bridge
    name: fm-net

volumes:
  fm-redis-data:
  fm-nacos-logs:
  fm-rabbitmq-data:
  fm-minio-data:
  fm-es-data:
  fm-es-plugins:
  fm-es-ik-config:
  fm-xxljob-logs:
