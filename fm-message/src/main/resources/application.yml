server:
  port: 8091
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: fm-message
  profiles:
    active: local

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /

    # ==================== P0-3 生产端确认 ====================
    # ★ 缺了这两行，RabbitMqHelper 里传的 CorrelationData 只是个随机 id（没人接结果）：
    #   交换机不存在 / 路由键拼错时，消息被 broker 静默丢弃，业务代码零感知。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true            # ★ 没有它，上面的 publisher-returns 永远不会触发
    # ==================== P0-4 消费端重试与死信 ====================
    listener:
      simple:
        # ★ 默认是 true —— 抛异常就立刻重新入队，一条毒消息能把整个队列永久堵死
        default-requeue-rejected: false
        prefetch: 20             # 一次只拉 20 条，慢消费者不会把堆吃满
        retry:
          enabled: true
          max-attempts: 3        # 1s / 2s 两轮退避后放弃
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000

fm:
  auth:
    resource:
      # ★ 管理端（后台）鉴权：/admin/** 要求管理员身份。
      #   M6-7 起拦截器由 fm-auth-resource-sdk 统一提供（此前 5 个服务各有一份副本，
      #   每份都要靠"记得写 .order(2)"才正确，已因此踩过一次坑）。
      #   ⚠️ order 由 SDK 保证，业务服务不需要、也不应该再自己注册。
      admin:
        enabled: true
      enable: true
      includeLoginPaths:
        # 用户端：只有本人能看自己的消息（服务端再按 UserContext 过滤一次）
        - /messages/**
        # 管理端：模板 / 公告（另有 AdminAuthInterceptor 校验管理员身份）
        # ★ 所有管理端接口统一放 /admin/** 下 —— 用路径前缀表达权限，比逐方法写角色判断更难漏
        - /admin/**
      excludeLoginPaths:
        # ⚠️ /internal/** 是服务间调用（Feign 没有 JWT），必须放行；
        #    它的安全边界是"只有我们的服务会构造这个请求"（不出现在网关对外文档里）
        - /health

# ==================== 站内信业务参数 ====================
message:
  # 公告的默认有效期（月）。与私信分开：公告是"一段时间内的通知"，私信要留得久些
  notice-ttl-months: 1
  # 定向通知（含业务通知）的默认有效期
  message-ttl-months: 6
  # ★ 短信是否走 Mock（本地开发 true）：Mock 只记录到 sms_record 表 + 打日志，
  #   走的是与真实渠道完全相同的代码路径，只是"第三方"换成自己 —— 这样验收可以自动化
  sms-mock: true

# ==================== XXL-JOB 执行器 ====================
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:9090/xxl-job-admin}
    accessToken: ${XXL_JOB_TOKEN:default_token}
    executor:
      appname: fm-message
      port: ${XXL_EXECUTOR_PORT:10001}
      logPath: ./logs/xxl-job/fm-message
      logRetentionDays: 7

---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    openfeign:
      # ★ P0-5：没有这一行，fm-api 里的 7 个 fallbackFactory 永远不会被触发
      #   （OpenFeign 的 fallback 只在 CircuitBreaker 开启时生效）。
      #   参数见 fm-api 的 FeignCircuitBreakerAutoConfiguration，不在这里重复。
      circuitbreaker:
        enabled: true
      # 2026-11-05 补：Feign 默认 readTimeout=60s —— 下游一挂，每次调用白占线程 60 秒
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        group: DEFAULT_GROUP
        namespace: public
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fm_message?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=2000&socketTimeout=10000
    username: root
    password: ${DB_PASSWORD:1234}
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:16379}
      database: 0

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    # ★ P0-8：级别改成可注入 —— 生产用 FM_LOG_LEVEL=info 即可降级，
    #   不必改 16 份配置再重启。注意 logging.level.* 在 logback 配置之后生效，
    #   所以改 logback-spring.xml 里的 <logger> 是无效的，改这里才有效。
    com.fitmind: ${FM_LOG_LEVEL:debug}
