server:
  port: 8090
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: fm-promotion
  profiles:
    active: local

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /

    # ==================== P0-3 生产端确认 ====================
    # ★ 缺了这两行，RabbitMqHelper 里传的 CorrelationData 只是个随机 id（没人接结果）：
    #   交换机不存在 / 路由键拼错时，消息被 broker 静默丢弃，业务代码零感知。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true            # ★ 没有它，上面的 publisher-returns 永远不会触发
    # ==================== P0-4 消费端重试与死信 ====================
    listener:
      simple:
        # ★ 默认是 true —— 抛异常就立刻重新入队，一条毒消息能把整个队列永久堵死
        default-requeue-rejected: false
        prefetch: 20             # 一次只拉 20 条，慢消费者不会把堆吃满
        retry:
          enabled: true
          max-attempts: 3        # 1s / 2s 两轮退避后放弃
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000

fm:
  auth:
    resource:
      enable: true
      includeLoginPaths:
        - /coupons/**
        - /user-coupons/**
        - /exchange-codes/**
        - /discount/**
      excludeLoginPaths:
        - /health
      # ==================== 管理端鉴权（#A9 修复，2026-09-20 补） ====================
      # 修复前：任意**学员**账号都能建券并发放（`POST /coupons` + `PUT /coupons/{id}/issue`）。
      #
      # ★★ 为什么只圈这两组：
      #    · /coupons/**        建券 + 发放 —— 只有运营会调
      #    · /exchange-codes/** 生成兑换码 —— 只有运营会调
      #    ⚠️ **不能**圈 `/user-coupons/**`：admin 页面的「我的券」也调它（管理员本身也是用户），
      #       圈进来会让管理员自己的券列表 403；学员端的券列表更是直接依赖它。
      #    ⚠️ **不能**圈 `/internal/**`：结算页试算**直接调** `/prs/internal/discount/detail`
      #       （前端注释里写明"网关只按 /prs/** 判需要登录"）—— 圈进来会让结算页算不出优惠。
      admin:
        enabled: true
        pathPatterns:
          - /coupons/**
          - /exchange-codes/**

# ==================== 促销业务参数 ====================
promotion:
  # ★ 叠加推荐的计算超时（毫秒）。
  #   券一多，方案数是阶乘级增长的 —— 超时后返回"已算出的最优解"，
  #   宁可少算几个方案，也不能让下单接口卡住。
  solution-timeout-ms: 1000
  # 参与排列组合的最大券数（超过就只算单券方案，防爆炸）
  max-permute-coupons: 6

# ==================== XXL-JOB ====================
# ⚠️ 本服务**不使用** XXL-JOB：促销模块没有定时任务
#    （券的过期靠有效期字段过滤，榜单结算是 fm-learning 的任务）。
#    原先这里留着一段 xxl.job 配置，但 pom 里并没有引 xxl-job-core ——
#    于是它是**死配置**：不报错、不生效、也看不出问题，
#    还让人误以为"fm-promotion 有执行器（10000）"。
#    不需要就删掉，别留着误导人。判据见《本地环境排障手册》§3.15。

---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    openfeign:
      # ★ P0-5：没有这一行，fm-api 里的 7 个 fallbackFactory 永远不会被触发
      #   （OpenFeign 的 fallback 只在 CircuitBreaker 开启时生效）。
      #   参数见 fm-api 的 FeignCircuitBreakerAutoConfiguration，不在这里重复。
      circuitbreaker:
        enabled: true
      # 2026-11-05 补：Feign 默认 readTimeout=60s —— 下游一挂，每次调用白占线程 60 秒
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        group: DEFAULT_GROUP
        namespace: public
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fm_promotion?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=2000&socketTimeout=10000
    username: root
    password: 1234
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:16379}
      password: 123456
      database: 0

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    # ★ P0-8：级别改成可注入 —— 生产用 FM_LOG_LEVEL=info 即可降级，
    #   不必改 16 份配置再重启。注意 logging.level.* 在 logback 配置之后生效，
    #   所以改 logback-spring.xml 里的 <logger> 是无效的，改这里才有效。
    com.fitmind: ${FM_LOG_LEVEL:debug}
