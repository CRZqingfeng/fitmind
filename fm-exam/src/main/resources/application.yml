server:
  port: 8092
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: fm-exam
  profiles:
    active: local

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /

    # ==================== P0-3 生产端确认 ====================
    # ★ 缺了这两行，RabbitMqHelper 里传的 CorrelationData 只是个随机 id（没人接结果）：
    #   交换机不存在 / 路由键拼错时，消息被 broker 静默丢弃，业务代码零感知。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true            # ★ 没有它，上面的 publisher-returns 永远不会触发
    # ==================== P0-4 消费端重试与死信 ====================
    listener:
      simple:
        # ★ 默认是 true —— 抛异常就立刻重新入队，一条毒消息能把整个队列永久堵死
        default-requeue-rejected: false
        prefetch: 20             # 一次只拉 20 条，慢消费者不会把堆吃满
        retry:
          enabled: true
          max-attempts: 3        # 1s / 2s 两轮退避后放弃
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000

fm:
  auth:
    resource:
      enable: true
      includeLoginPaths:
        # 学员端：体测记录 / 考核提交（服务端按 UserContext 过滤，只能看自己的）
        - /assessments/**
        - /action-assessments/**
        # 管理端：教练评分、查看他人的考核（另有 AdminAuthInterceptor 校验管理员/教练身份）
        - /admin/**
      excludeLoginPaths:
        - /health
      # ==================== 管理端鉴权（#A9 修复，2026-09-20 补） ====================
      # 本服务最省事：管理端接口本来就在 `/admin/**` 前缀下
      # （`ActionAssessmentAdminController` = `/admin/action-assessments/**`），
      # 正好是 SDK 的默认 pattern —— 只需要把开关打开。
      # ★ 学员端提交考核走 `/action-assessments/**`（不带 /admin 前缀），不受影响。
      admin:
        enabled: true
        pathPatterns:
          - /admin/**

# ==================== 体测业务参数 ====================
exam:
  # 体测记录保留多少个月（用于趋势图的时间窗口）
  trend-months: 24
  # ★ 性别未知时的兜底策略：true = 用"中性"标准（男女区间的中间值）并在结论里注明；
  #   false = 直接拒绝评估。
  #   选 true 是因为"给一个带说明的粗略结论"比"什么都不给"有用，
  #   但绝不能静默按某一性别算 —— 那会给出看似精确实则错误的数字。
  allow-unknown-gender: true

---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    openfeign:
      # ★ P0-5：没有这一行，fm-api 里的 7 个 fallbackFactory 永远不会被触发
      #   （OpenFeign 的 fallback 只在 CircuitBreaker 开启时生效）。
      #   参数见 fm-api 的 FeignCircuitBreakerAutoConfiguration，不在这里重复。
      circuitbreaker:
        enabled: true
      # 2026-11-05 补：Feign 默认 readTimeout=60s —— 下游一挂，每次调用白占线程 60 秒
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        group: DEFAULT_GROUP
        namespace: public
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fm_exam?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=2000&socketTimeout=10000
    username: root
    password: ${DB_PASSWORD:1234}

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    # ★ P0-8：级别改成可注入 —— 生产用 FM_LOG_LEVEL=info 即可降级，
    #   不必改 16 份配置再重启。注意 logging.level.* 在 logback 配置之后生效，
    #   所以改 logback-spring.xml 里的 <logger> 是无效的，改这里才有效。
    com.fitmind: ${FM_LOG_LEVEL:debug}
