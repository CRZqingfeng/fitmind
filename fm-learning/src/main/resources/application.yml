server:
  port: 8086
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: fm-learning
  profiles:
    active: local

  # ==================== RabbitMQ ====================
  # 完成训练动作后发 section.learned 事件（M3-2 积分体系消费）。
  # 注意：必须写在已有 spring 块内——同一 YAML 文档里再写一个顶层 spring: 会触发
  #      DuplicateKeyException（M2-2a 已踩过）
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /

    # ==================== P0-3 生产端确认 ====================
    # ★ 缺了这两行，RabbitMqHelper 里传的 CorrelationData 只是个随机 id（没人接结果）：
    #   交换机不存在 / 路由键拼错时，消息被 broker 静默丢弃，业务代码零感知。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true            # ★ 没有它，上面的 publisher-returns 永远不会触发
    # ==================== P0-4 消费端重试与死信 ====================
    listener:
      simple:
        # ★ 默认是 true —— 抛异常就立刻重新入队，一条毒消息能把整个队列永久堵死
        default-requeue-rejected: false
        prefetch: 20             # 一次只拉 20 条，慢消费者不会把堆吃满
        retry:
          enabled: true
          max-attempts: 3        # 1s / 2s 两轮退避后放弃
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000

# ==================== 业务配置 ====================
fm:
  auth:
    resource:
      # ★ 管理端（后台）鉴权：/admin/** 要求管理员身份。
      #   M6-7 起拦截器由 fm-auth-resource-sdk 统一提供（此前 5 个服务各有一份副本，
      #   每份都要靠"记得写 .order(2)"才正确，已因此踩过一次坑）。
      #   ⚠️ order 由 SDK 保证，业务服务不需要、也不应该再自己注册。
      admin:
        enabled: true
      # 开启登录拦截（与网关形成双重防护，直连服务端口时同样受保护）
      enable: true
      includeLoginPaths:
        - /lessons/**
        - /learning-records/**
        - /sign-records/**
        - /boards/**
        # M3-3 互动问答（用户端 + 管理端）
        - /questions/**
        - /replies/**
        # M3-3b 学习笔记
        - /notes/**
        # 管理端：登录之后还要过 AdminAuthInterceptor 的角色校验（必须管理员）
        - /admin/**
      excludeLoginPaths:
        # 内部接口：定时任务 / 人工触发的兜底操作，无 token
        - /lessons/internal/**
        - /boards/internal/**
        - /health

# ==================== XXL-JOB 执行器 ====================
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:9090/xxl-job-admin}
    accessToken: ${XXL_JOB_TOKEN:default_token}
    executor:
      appname: fm-learning
      # ⚠️ 执行器通讯端口每个服务必须不同（fm-media 用 9996）
      port: ${XXL_EXECUTOR_PORT:9995}
      logPath: ./logs/xxl-job/fm-learning
      logRetentionDays: 7

# ==================== 学习进度合并参数 ====================
learning:
  record:
    # 停播后多久落库（秒）。
    # ★★ 必须 **大于前端上报间隔（15s）**，这是"合并"成立的前提：
    #    每次上报都 ZADD 覆盖 score（= 上报时刻 + 本值）。只有本值 > 上报间隔，
    #    下一次上报才赶得上在任务到期前把它顺延掉；否则任务先到期被消费，
    #    每次上报都落库一次，合并彻底失效。
    #    实测（.tmp/verify-delay-merge.py）：5s 时 8 次上报 → 8 次落库；20s 时 → 1 次落库。
    delay-seconds: 20
    # Redis 进度缓存 TTL（秒）。必须大于 delay-seconds —— 任务到期时缓存还在，才读得到最新断点。
    # 留足余量（消费线程可能被前一个任务阻塞）。当前 60s > 延迟 20s，余量 40s。
    # ★ 续播查询也读这份缓存（见《待修复问题清单》#A21），TTL 长一点对"进度回退"也是好事。
    cache-ttl-seconds: 60

# ==================== 本地开发环境 ====================
---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    openfeign:
      # ★ P0-5：没有这一行，fm-api 里的 7 个 fallbackFactory 永远不会被触发
      #   （OpenFeign 的 fallback 只在 CircuitBreaker 开启时生效）。
      #   参数见 fm-api 的 FeignCircuitBreakerAutoConfiguration，不在这里重复。
      circuitbreaker:
        enabled: true
      # 2026-11-05 补：Feign 默认 readTimeout=60s —— 下游一挂，每次调用白占线程 60 秒
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        group: DEFAULT_GROUP
        namespace: public
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fm_learning?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=2000&socketTimeout=10000
    username: root
    password: ${DB_PASSWORD:1234}
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:123456}
      database: 0

# ==================== MyBatis-Plus ====================
mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    # ★ P0-8：级别改成可注入 —— 生产用 FM_LOG_LEVEL=info 即可降级，
    #   不必改 16 份配置再重启。注意 logging.level.* 在 logback 配置之后生效，
    #   所以改 logback-spring.xml 里的 <logger> 是无效的，改这里才有效。
    com.fitmind: ${FM_LOG_LEVEL:debug}
