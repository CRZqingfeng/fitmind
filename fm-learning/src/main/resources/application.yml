server:
  port: 8086
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: fm-learning
  profiles:
    active: local

  # ==================== RabbitMQ ====================
  # 完成训练动作后发 section.learned 事件（M3-2 积分体系消费）。
  # 注意：必须写在已有 spring 块内——同一 YAML 文档里再写一个顶层 spring: 会触发
  #      DuplicateKeyException（M2-2a 已踩过）
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /

# ==================== 业务配置 ====================
fm:
  auth:
    resource:
      # ★ 管理端（后台）鉴权：/admin/** 要求管理员身份。
      #   M6-7 起拦截器由 fm-auth-resource-sdk 统一提供（此前 5 个服务各有一份副本，
      #   每份都要靠"记得写 .order(2)"才正确，已因此踩过一次坑）。
      #   ⚠️ order 由 SDK 保证，业务服务不需要、也不应该再自己注册。
      admin:
        enabled: true
      # 开启登录拦截（与网关形成双重防护，直连服务端口时同样受保护）
      enable: true
      includeLoginPaths:
        - /lessons/**
        - /learning-records/**
        - /sign-records/**
        - /boards/**
        # M3-3 互动问答（用户端 + 管理端）
        - /questions/**
        - /replies/**
        # M3-3b 学习笔记
        - /notes/**
        # 管理端：登录之后还要过 AdminAuthInterceptor 的角色校验（必须管理员）
        - /admin/**
      excludeLoginPaths:
        # 内部接口：定时任务 / 人工触发的兜底操作，无 token
        - /lessons/internal/**
        - /boards/internal/**
        - /health

# ==================== XXL-JOB 执行器 ====================
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:9090/xxl-job-admin}
    accessToken: ${XXL_JOB_TOKEN:default_token}
    executor:
      appname: fm-learning
      # ⚠️ 执行器通讯端口每个服务必须不同（fm-media 用 9996）
      port: ${XXL_EXECUTOR_PORT:9995}
      logPath: ./logs/xxl-job/fm-learning
      logRetentionDays: 7

# ==================== 学习进度合并参数 ====================
learning:
  record:
    # 上报停播后多久落库（秒）。播放中每次上报都会把到期时间顺延，
    # 所以该值只影响「停播后多久落库」，不影响合并效果
    delay-seconds: 5
    # Redis 进度缓存 TTL（秒）。必须 > 上报间隔（15s）+ 延迟时长，否则任务到期读不到缓存
    cache-ttl-seconds: 30

# ==================== 本地开发环境 ====================
---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        group: DEFAULT_GROUP
        namespace: public
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fm_learning?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:16379}
      password: 123456
      database: 0

# ==================== MyBatis-Plus ====================
mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.fitmind: debug
