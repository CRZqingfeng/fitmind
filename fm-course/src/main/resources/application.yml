server:
  port: 8084
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: fm-course
  profiles:
    active: local

  # ==================== RabbitMQ ====================
  # 课程上下架后发消息，由 fm-search（M2-3）消费并同步 ES 索引。
  # 注意：必须写在已有 spring 块内——同一 YAML 文档里再写一个顶层 spring: 会触发
  #      DuplicateKeyException（已踩过）
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /

# ==================== 业务配置 ====================
fm:
  # 短信为 Mock：验证码只打日志，并随接口响应返回，方便本地调试。生产环境请置 false
  sms:
    mock: true
  auth:
    resource:
      # 开启登录拦截（与网关形成双重防护，直连服务端口时同样受保护）
      enable: true   #true
      includeLoginPaths:
        - /categorys/**
        - /courses/**
      excludeLoginPaths:
        # 内部 Feign 调用不走网关，没有 token，必须放行
        - /courses/internal/**
        - /health
      # ==================== 管理端鉴权（#A9 收尾，2026-09-21 补） ====================
      # 修复前：本服务的接口只过 LoginAuthInterceptor（只校验「已登录」），
      #         于是任意**学员**账号都能建课、改课、上架、下架、删课，
      #         还能 `GET /subjects/page` 直接拿走**所有题目的答案与解析**。
      #
      # ★★ 这是 #A9 里最后一块，也是最难的一块，难点不在路径划分，而在「调用方」：
      #    修好它必须**同时改 scripts/ 下的验收脚本** —— 那些脚本一直用**学员 token** 建课
      #    （seed-demo-data.mjs 里曾写着「建课接口只要求已登录，不限角色」，
      #     那句注释描述的正是这个漏洞）。现已统一改为**教练（staff）token**。
      #
      # ★ 为什么用 `METHOD:/path` 而不是纯路径：/courses 下的路径**同形不同权**——
      #     GET  /courses/baseInfo/{id}  ← 学员端课程详情（必须放行）
      #     POST /courses/baseInfo/save  ← 管理端保存（必须拦）
      #   纯路径 pattern 区分不了方法，只能把整个 /courses/** 放进来，
      #   那会连学员端课程详情一起拦掉。（SDK 的方法级匹配见 ResourceAuthInterceptor）
      #
      # ★★ 刻意**不拦**的三条（都是学员端在用的读接口，拦了会静默打断用户端）：
      #     GET /courses/baseInfo/{id}   ← 学员端课程详情（虽然它「优先取草稿」）
      #     GET /courses/teachers/{id}   ← 学员端看教练（带 see=true）
      #     GET /courses/{id}/catalogs   ← 学员端看训练目录
      #     GET /categorys/**            ← 分类列表，学员端也用来做筛选（数据本就不敏感）
      admin:
        enabled: true
        pathPatterns:
          # ---- 课程写入（管理端专属）----
          - POST:/courses/baseInfo/save
          - POST:/courses/catas/save/**
          - POST:/courses/media/save/**
          - POST:/courses/teachers/save
          - POST:/courses/upShelf
          - POST:/courses/downShelf
          - DELETE:/courses/delete/**
          # ---- 课程管理端读：列表含**未上架**课程；catas 默认 see=false → 草稿目录 ----
          - GET:/courses/page
          - GET:/courses/checkName
          - GET:/courses/checkBeforeUpShelf/**
          - GET:/courses/catas/**
          # ---- 题目：这两个接口**都含答案与解析**（学员只能经 /practices 拿题，那条不下发答案）----
          - /subjects/**
          - /courses/subjects/**
          # ---- 分类写入（读接口刻意不拦，见上面说明）----
          - POST:/categorys/add
          - PUT:/categorys/update
          - PUT:/categorys/disableOrEnable
          - DELETE:/categorys/**

# ==================== 本地开发环境 ====================
---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    openfeign:
      # 2026-11-05 补：Feign 默认 readTimeout=60s —— 下游一挂，每次调用白占线程 60 秒
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        group: DEFAULT_GROUP
        namespace: public
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fm_course?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=2000&socketTimeout=10000
    username: root
    password: 1234
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:16379}
      password: 123456
      database: 0

# ==================== MyBatis-Plus ====================
mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.fitmind: debug
    com.fitmind.user.mapper: debug
