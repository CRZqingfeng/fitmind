server:
  port: 8081
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: fm-auth
  profiles:
    active: local

# ==================== JWT 密钥库 ====================
fm:
  encrypt:
    key-store:
      alias: fitmind           # 密钥别名
      location: classpath:fitmind.jks
      password: ${JWT_KEYSTORE_PASSWORD:fm123321}       # 密钥库密码
      secret: fm123321         # 私钥密码
      type: JKS
  auth:
    resource:
      # 认证服务自身也需要鉴权：退出登录等接口必须登录后才能调用
      enable: true
      includeLoginPaths:
        - /accounts/logout

# ==================== 本地开发环境 ====================
---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    # ★ P0-5：本服务一直在用 Feign（AccountServiceImpl → UserClient），
    #   但此前<b>没有任何 openfeign 配置</b> —— 意味着吃的是默认 readTimeout=60s：
    #   用户服务一挂，每次登录都会白占线程 60 秒。这里补上与其它服务一致的配置。
    openfeign:
      circuitbreaker:
        enabled: true        # 没有这一行，fm-api 的 UserClientFallback 永远不会被触发
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        group: DEFAULT_GROUP
        namespace: public
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fm_auth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:1234}
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:123456}
      database: 0

# ==================== MyBatis-Plus ====================
mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    # ★ P0-8：级别改成可注入 —— 生产用 FM_LOG_LEVEL=info 即可降级，不必改 16 个文件再重启。
    #   注意 logging.level.* 在 logback 配置之后生效，所以改 logback-spring.xml 的 <logger> 无效，改这里才有效。
    com.fitmind: ${FM_LOG_LEVEL:debug}
    com.fitmind.auth.mapper: debug
