server:
  port: 8083
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: fm-media
  profiles:
    active: local
  # ==================== 上传大小限制（M12-1） ====================
  # ★ Spring Boot 默认单文件 1MB、单请求 10MB，而**一个分片就是 5MiB**（S3 下限），
  #   不放开会直接 413 / MaxUploadSizeExceededException，且报错发生在进 Controller 之前，
  #   日志里只看到 "Maximum upload size exceeded"，完全看不出是哪一层的限制。
  # ★ 为什么只给 8MB 而不是 1GB：一次请求最多只带**一片**。
  #   放大到 GB 等于给"一个请求把堆塞满"开门 —— 分片上传本身就是为这件事设计的。
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

# ==================== 业务配置 ====================
fm:
  # 短信为 Mock：验证码只打日志，并随接口响应返回，方便本地调试。生产环境请置 false
  sms:
    mock: true
  auth:
    resource:
      # 开启登录拦截（与网关形成双重防护，直连服务端口时同样受保护）
      enable: true
      includeLoginPaths:
        - /files/**
        - /medias/**
      excludeLoginPaths:
        # 注意：**登录拦截**的路径匹配只针对「路径」，不支持 METHOD:/path 写法
        # （METHOD: 前缀目前只在网关的自定义匹配、以及下面的 admin.pathPatterns 中支持）
        # 内部 Feign 调用没有 token，必须放行，否则课程模块查不到媒资
        - /medias/internal/**
        - /students/register
        - /students/password
        - /users/checkCellphone
        - /health
        # 服务间调用接口：由网关鉴权体系之外的内部调用使用
        - /users/detail/**
        - /users/list
        - /users/ids
      # ==================== 管理端鉴权（#A9 修复；M7-10 改为方法级） ====================
      # 修复前：本服务的接口只过 LoginAuthInterceptor（只校验"已登录"），
      #         于是任意**学员**账号都能删媒资 —— 实测确认过。
      #
      # ★★ 为什么不能写 `/medias/**`：
      #    SDK 的保护按**路径前缀**匹配（Ant pattern），**区分不了 HTTP 方法**，
      #    而 `/medias/**` 下混着三类调用方：
      #      · GET  /medias/{id}/play-url   ← 学员端播视频在用（portal/src/api/media.ts）
      #      · GET  /medias/internal/{id}   ← 课程模块的 Feign 内部调用
      #      · 其余                          ← 才是管理端语义
      #    写成 `/medias/**` 会**同时打断学员端播放和课程详情**。
      #
      # ★★★ M7-10 起 SDK 的 pathPatterns 支持 `METHOD:/path`，
      #    于是"学员也要上传视频"这件事才有解：
      #      `POST /medias/upload-signature`（学员上传动作考核视频）
      #      与 `DELETE /medias/{id}`（只有运营能删）**路径形状完全相同**，
      #      以前只能二选一（要么误伤学员上传、要么放开删除）。
      admin:
        enabled: true
        pathPatterns:
          # 分页(GET) / 批量删除(DELETE)：管理端语义
          - /medias
          # 管理端预览
          - /medias/*/preview-url
          # ★ 单条删除：只有运营能删 —— 用方法级，避免连"学员上传"一起拦掉
          - DELETE:/medias/*
          # ★ 刻意**不圈**下面这些：
          #     POST /medias/upload-signature   申请直传签名（学员上传动作考核视频）
          #     POST /medias/*/confirm          上传完成后确认（同一流程的一环）
          #   它们仍受 LoginAuthInterceptor 保护（includeLoginPaths 含 /medias/**），
          #   即"必须登录，但不要求管理员"。
          #
          # ★★ `/files/**` 也**刻意不圈**（M7-11 撤下）：它是**通用文件服务**，
          #    不是运营专属 —— `BizType` 含 `avatar` / `common` 这类**学员侧**用途，
          #    而 M2-1 验收脚本本来就用**学员** token 上传封面（`bizType=media-cover`）。
          #    M7-9 把它一起圈进来属于**收权收宽了**：把"学员的通用文件能力"当成
          #    "运营的媒资管理"给拦了 → M2-1 从那天起就红。
          #    真正的运营面是 `/medias`（媒资列表/删除/预览），那几条已经拦住了。
          #
          # ⚠️ 由此留下的缺口（已登记 #A14）：`DELETE /files/{id}` 任何**登录用户**都能调。
          #    但它的正解不是"要求管理员"，而是**归属校验**（只能删自己上传的）——
          #    那一层 fm-media 目前没有。用角色去堵权限缺口会连正常功能一起堵掉。

# ==================== XXL-JOB 执行器 ====================
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:9090/xxl-job-admin}
    accessToken: ${XXL_JOB_TOKEN:default_token}
    executor:
      appname: fm-media
      # ⚠️ 执行器通讯端口每个服务必须不同（fm-learning 用 9995）
      port: ${XXL_EXECUTOR_PORT:9996}
      logPath: ./logs/xxl-job/fm-media
      logRetentionDays: 7

# ==================== 本地开发环境 ====================
---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        group: DEFAULT_GROUP
        namespace: public
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fm_media?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:16379}
      password: 123456
      database: 0

# ==================== MyBatis-Plus ====================
mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.fitmind: debug
    com.fitmind.user.mapper: debug

# ==================== 对象存储（可插拔：MinIO ⇄ 阿里云 OSS） ====================
#
# ★★ 切换方式：改 `fm.storage.type` 一行（或用环境变量 FM_STORAGE_TYPE）+ 重启本服务，
#    **不用改代码、不用重新编译**。装配哪套实现在代码里用 @ConditionalOnProperty 二选一：
#      minio → MinioConfig / MinioInitializer / MinioFileStorage / MinioMediaStorage
#      oss   → OssConfig  / OssFileStorage    / OssMediaStorage
#    两套实现同一个 IFileStorage / IMediaStorage，上层 Service 完全无感。
#
# ★ 这里只放**与厂商无关**的东西（type / bucket / 签名有效期）；
#   各厂商自己的 endpoint / 凭据放各自的命名空间（fm.minio.* / fm.oss.*）。
#     —— 这是 M9-1 从 MinIO 单一后端演进到多后端时踩出来的：原先两个 ServiceImpl
#        为了读签名有效期而直接注入 MinioProperties，一旦换后端就注入失败、服务起不来。
fm:
  storage:
    # ★ 不配任何环境变量时走哪一套：**oss**（项目主用）。
    #   两个入口现在**一致**了（2026-11-04 M12-1 起）：
    #     · 脚本（scripts/start-all.sh / start-group.sh）`${FM_STORAGE_TYPE:-oss}`
    #     · IDEA（不经过脚本，`java -jar`）用这里的默认值 → 也是 oss
    #   之前两边一个 minio 一个 oss，导致"用脚本起是 MinIO、用 IDEA 起是 OSS"，
    #   排查时日志和现象完全对不上（M12-1 首轮验收就栽在这上面）。
    #   离线/断网开发：`FM_STORAGE_TYPE=minio` 显式覆盖。
    type: ${FM_STORAGE_TYPE:oss}
    # ★ **MinIO 的**桶名（OSS 的桶在同级的 fm.oss.bucket，两者刻意不共用 —— 见那里的注释）。
    #   末位保留 MINIO_BUCKET 是为了**向后兼容**旧环境（此前没有任何地方设置过它）。
    bucket: ${FM_STORAGE_BUCKET:${MINIO_BUCKET:fitmind}}
    upload-expire: 3600
    play-expire: 7200
    preview-expire: 1800

  # ---- MinIO（fm.storage.type=minio 时使用；离线开发可选，默认走 OSS）----
  #
  # 凭据一律走环境变量注入（真实值在 docker/.env），不写死进 git。
  # endpoint        —— SDK 内部调用用的地址（服务在宿主机跑，所以用 localhost）
  # public-endpoint —— 生成给浏览器的预签名 URL 用的地址
  #    ⚠️ 这两个必须分开配。MinIO 的 SigV4 签名把 Host 头算进签名，
  #       用 A 地址签的 URL 拿去 B 地址访问会 403 SignatureDoesNotMatch。
  #       将来部署到容器网络时，endpoint 换成 fm-minio:9000，public-endpoint 换成外网域名。
  #
  # ★ 这层"用内网地址签名、再替换成对外地址"是 **MinIO 专属**，OSS 不需要（它是公网服务）。
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}

  # ---- 阿里云 OSS（fm.storage.type=oss 时使用）----
  #
  # 凭据同样走环境变量（docker/.env → scripts/start-group.sh → 这里），**绝不进 git**。
  # ★ 与 MinIO 的两个关键差异（详见 docs/M9-1-对象存储可插拔开发方案.md §五）：
  #   ① URL 形态是 **virtual-hosted**（https://{bucket}.{endpoint}/{key}），不是 path-style；
  #   ② V4 签名把 host 算进签名，且 **Content-Type 也参与签名** ——
  #      生成预签名 URL 时带了 Content-Type，前端 PUT 就必须带一模一样的值，
  #      否则 403 SignatureDoesNotMatch（浏览器会自动补 MIME，所以必须显式对齐）。
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    # ★ OSS 用自己的桶名，**不共用 fm.storage.bucket**：
    #   两个后端的桶名天然不同（MinIO=fitmind / OSS=itcrz-9527），
    #   共用一个键就必然共用一个兜底默认值 —— 那个默认值只可能对一边正确。
    #   ⚠️ 曾经的坑（2026-10-04）：IDEA 启动没人注入桶名 → 兜底成 fitmind
    #      → 签出 https://fitmind.oss-cn-beijing.aliyuncs.com/...（桶不存在）
    #      → 浏览器预检 404 NoSuchBucket，而前端只报"网络中断"。
    #   取值优先级：OSS_BUCKET → FM_STORAGE_BUCKET → itcrz-9527
    bucket: ${OSS_BUCKET:${FM_STORAGE_BUCKET:itcrz-9527}}
    # 给浏览器的域名。用 OSS 默认域名时与 endpoint 相同；
    # 将来绑自定义域名（需备案）时改这里 —— ★ 它同时是**签名用的域名**，两者必须一致。
    public-endpoint: ${OSS_PUBLIC_ENDPOINT:${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}}
    # ★ 不是冗余项：OSS 要用 V4 签名就必须显式给 region
    region: ${OSS_REGION:cn-beijing}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
