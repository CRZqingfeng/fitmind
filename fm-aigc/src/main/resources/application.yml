server:
  port: 8094
  tomcat:
    uri-encoding: UTF-8
    # AI 对话是长连接（SSE），每个连接占一个线程直到回答结束。
    # 默认 200 个线程在演示场景够用，但要知道这个数就是"同时能有多少人问问题"的上限；
    # 真上量时的解法是换成 WebFlux（本模块已经是 Reactor 流，改造代价不大）。
    threads:
      max: 200

spring:
  application:
    name: fm-aigc
  profiles:
    active: local

  # ==================== Spring AI ====================
  # ★ chat 与 embedding 都走 OpenAI 兼容协议（方案 §十五 D2/D4）：
  #    chat 用 DeepSeek，embedding 用阿里百炼 —— 两家都是 OpenAI 规范，
  #    所以共用同一套 starter，"换供应商"在这里只是一个配置项。
  ai:
    openai:
      base-url: ${AIGC_CHAT_BASE_URL:https://api.deepseek.com}
      # ⚠️ 默认值必须是**非空**的 not-configured，不能留空：
      #    OpenAiApi 在构造时断言 apiKey 非空，空串会让**服务启动失败**。
      #    一个"没配 key"的配置问题不该升级成"服务起不来" —— 它应该表现为
      #    "调用时 401 → 走降级文案"，而且会在启动日志里明确告诉我们走的是哪个通道。
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      chat:
        # ⚠️ 与 fm.ai.chat.provider 必须一致（provider=mock 时要关掉它，
        #    否则会同时存在两个 ChatModel Bean）。start-all.sh 已封装好这个联动。
        #    万一没对齐也不会挂：Mock Bean 标了 @Primary，且 api-key 有非空兜底。
        enabled: ${AIGC_CHAT_ENABLED:true}
        options:
          # ⚠️ 不要写 deepseek-chat —— 那是已于 2026-07-24 退休的遗留别名
          #    （实测仍能静默解析到 deepseek-flash，但随时可能失效）。
          #    以 GET /models 返回的为准：deepseek-flash / deepseek-v4-pro
          model: ${AIGC_CHAT_MODEL:deepseek-flash}
          temperature: 0.7
      # ⚠️ 必须保持 false：这里的一套 base-url/key 是给 chat 用的，
      #    用它去调 embedding 会 404（DeepSeek 根本没有 embeddings 接口）。
      #    M6-3 在 EmbeddingConfig 里为百炼单独建了一套（见下面 fm.ai.rag）。
      embedding:
        enabled: false

fm:
  auth:
    resource:
      # ★ 管理端（后台）鉴权：/admin/** 要求管理员身份。
      #   M6-7 起拦截器由 fm-auth-resource-sdk 统一提供（此前 5 个服务各有一份副本，
      #   每份都要靠"记得写 .order(2)"才正确，已因此踩过一次坑）。
      #   ⚠️ order 由 SDK 保证，业务服务不需要、也不应该再自己注册。
      admin:
        enabled: true
      enable: true
      includeLoginPaths:
        # ★ 对话必须登录：用户上下文是工具鉴权的根（M6-4 的 BodyTools 要读
        #    "当前用户"的体测档案，userId 只从 UserContext 取，绝不由 LLM 提供）
        - /chat/**
        # ★ 管理端（知识库重建）也要登录：先由 SDK 解析出用户，再由
        #    AdminAuthInterceptor 判管理员。缺了这一条的话，
        #    UserContext 拿不到 userId，拦截器会把管理员也挡在外面（401），
        #    而症状是"管理员访问管理端接口竟然说未登录"——很难联想到是白名单问题
        - /admin/**
      excludeLoginPaths:
        - /health

  # ==================== AI 行为配置 ====================
  ai:
    chat:
      # deepseek | mock。mock 是内置确定性模型，供自动化验收与离线演示
      # （与 M4-2 的 Mock 支付渠道、M4-4 的 Mock 退款同一个思想）
      provider: ${AIGC_CHAT_PROVIDER:deepseek}
      # 单轮模型调用超时。超时后返回可读的降级文案，不是 500
      timeout-ms: ${AIGC_CHAT_TIMEOUT_MS:60000}
      # ★ 意图路由单独的超时，必须比上面短得多：路由只输出一个词，
      #   但它排在链路最前面，用 60s 的话模型一抖动用户要干等一分钟。
      #   超了就兜底到知识问答（用户几乎无感）。
      route-timeout-ms: ${AIGC_ROUTE_TIMEOUT_MS:10000}
      # 默认编排策略：ROUTE（多 Agent）/ ENHANCE（单 Agent + 增强）/ SIMPLE（纯对话基线）
      # 请求可以用 chatType 参数临时覆盖（演示与验收用）
      type: ${AIGC_CHAT_TYPE:ROUTE}
    mock:
      # 每个分片的字符数 —— Mock 要"真的分片"，否则 SSE 拼接/打字机/
      # 打断时"已生成部分落库"这些代码在验收里等于没跑
      chunk-size: 4
      chunk-delay-ms: 30
      # 把 prompt 全文存进 Redis，供验收脚本断言"检索到的文档确实进了 prompt"
      snapshot-prompt: true
    prompt:
      # ★ 提示词三级来源：Nacos（热更新）→ classpath:prompts/*.txt → 代码兜底
      #   关掉 Nacos 就是"纯本地文件"模式，功能不受影响，只是改提示词要重启。
      #   注意：**读不到不等于出错** —— 不会出现"提示词为空导致 AI 不受控"（常见实现的坑）。
      nacos:
        enabled: ${AIGC_PROMPT_NACOS_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: nacos
        password: nacos
        group: DEFAULT_GROUP
        # ⚠️ 必须与"发布配置时选的命名空间"一致，否则静默读不到（发布返回 true、列表也看得到，
        #    但客户端 getConfig 返回 null，且不报错）。Nacos 3.x 里 public 的 ID 是 public
        #    （3.x 之前是空串），这个变化让"发布成功但读不到"很容易发生 —— 排查时先对这里。
        namespace: ${AIGC_PROMPT_NACOS_NAMESPACE:public}
        # 每个 Agent 一个配置项：fm-aigc-prompt-route / -consult / -recommend / -buy / -knowledge / -simple
        data-id-prefix: fm-aigc-prompt-
        timeout-ms: 3000
        # ★ 缓存有效期：超过它就主动重新拉取。这是"配置变更最终生效"的兜底 ——
        #   本环境实测 Nacos 的推送（listener）注册成功但不触发，
        #   而主动拉取只依赖 getConfig（已验证可用），可靠性高得多。
        #   30 秒对"改提示词"足够快，开销可忽略。设小一点调试更方便（比如 5000）。
        refresh-interval-ms: ${AIGC_PROMPT_REFRESH_MS:30000}

    # ==================== RAG（M6-3） ====================
    rag:
      # bailian（阿里百炼，真实语义向量）| deterministic（内置确定性向量，离线兜底）
      # ★ 与 provider=mock 是同一个思想：外部依赖必须有一个确定性替身，
      #   否则"RAG 链路对不对"就只能靠人肉试、还依赖网络与额度。
      provider: ${AIGC_RAG_PROVIDER:bailian}
      # ⚠️ embedding 与 chat 是两家供应商、两套 base-url —— 这正是"走 OpenAI 兼容协议"
      #    的价值：代码完全一样，只是换了地址和模型名
      base-url: ${AIGC_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      # 非空兜底，理由同 chat 的 api-key（见上面那段注释）
      api-key: ${DASHSCOPE_API_KEY:not-configured}
      model: ${AIGC_EMBEDDING_MODEL:text-embedding-v4}
      # ⚠️ 维度是索引 schema 的一部分，改它必须重建索引（索引名会自动带上维度）
      dimensions: ${AIGC_EMBEDDING_DIMS:1024}
      index-prefix: fitmind_knowledge
      # ⚠️ ES 在 9201（9200 被 Cpolar 占用）
      es-host: ${ES_HOST:127.0.0.1}
      es-port: ${ES_PORT:9201}

      # ---- 检索参数（这一组是"调 RAG 效果"时真正要动的东西） ----
      # ★ 常见实现是 query("") + topK(999)，等于把整库塞进 prompt；这里是 4 条
      top-k: ${AIGC_RAG_TOP_K:4}
      # ★ 低于阈值的结果不送进 prompt —— 宁可拒答，不要基于不相关内容硬编
      similarity-threshold: ${AIGC_RAG_THRESHOLD:0.55}
      # ★ 关键词 + 向量混合检索（ES 同时是全文检索引擎，这是选它的额外收益）
      hybrid: ${AIGC_RAG_HYBRID:true}
      keyword-top-k: 6
      # 向量一路先多召回一些，融合后裁到 top-k（否则融合完可能不够条数）
      vector-top-k: 8

      # 分块：中文按字符切比按 token 切更贴合真实长度
      chunk-size: 600
      chunk-overlap: 120
      # 成本护栏：送进 prompt 的检索内容上限
      max-context-chars: 4000

    # ==================== 会话记忆（M6-5） ====================
    # ★★ 双层结构：Redis 是"喂给模型的上下文窗口"（会被压缩/截断/过期），
    #    MySQL 的 chat_message 是"完整档案"（一条不少）。
    #    常见实现只有 Redis 那一层，于是"给用户看的历史"和"给模型看的上下文"
    #    是同一份数据，两个需求互相牵制 —— 这是本阶段最值得讲的一处结构差异。
    memory:
      # 关掉就是"每轮都是新对话"（排查"是不是历史在捣乱"时很有用）
      enabled: ${AIGC_MEMORY_ENABLED:true}
      # 送进 prompt 的最近轮数（1 轮 = 1 问 + 1 答）
      recent-turns: ${AIGC_MEMORY_RECENT_TURNS:6}
      # Redis 列表兜底上限（LTRIM）。正常情况下压缩会让它远小于这个数
      max-messages: 200
      # ★ 必须有 TTL：否则不活跃的会话会永久占着 Redis 内存
      ttl-days: 7
      compress:
        # 上下文压缩：把窗口外的旧内容折成摘要塞回窗口内
        # ★ 常见实现的压缩靠"模型输出里出现 agentName"触发，而该条件在**流式路径下
        #   永远不成立** → "开了压缩"和"没开"线上行为完全一样且不报错。
        #   这里改成按"可观测的数量指标"触发，与模型输出了什么无关。
        enabled: ${AIGC_MEMORY_COMPRESS:true}
        # 两个触发条件是"或"：
        trigger-messages: ${AIGC_MEMORY_COMPRESS_TRIGGER:16}
        #   · 字符数这条防的是"条数没到但每条都很长"（问 5 个问题、答了 5 段长文）
        trigger-chars: 3000
        # 压缩后保留的最近原文条数
        keep-messages: 6
        max-summary-chars: 800
        # 压缩是**同步**发生在首字之前的一次额外模型调用，超时要短：
        # 最坏情况是"这轮不压了"，而不是让用户为一次后台优化多等几十秒
        timeout-ms: 15000

    # ==================== 分布式打断（M6-5） ====================
    stop:
      # ★ 标记是**租约**不是**状态**：无论进程怎么挂在半路，它都会自动消失 ——
      #   于是"会话永久卡死"在结构上不可能发生（常见实现没有 TTL，
      #   用户关掉页面 = 这个会话再也用不了，只能重启服务）
      ttl-seconds: ${AIGC_STOP_TTL_SECONDS:120}
      # ★ 节流：每个分片都查一次 Redis 的话，一段 200 字的回答就是 50 次往返。
      #   用最多 200ms 的停止延迟换掉这 50 次往返。
      check-interval-ms: ${AIGC_STOP_CHECK_MS:200}

---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        group: DEFAULT_GROUP
        namespace: public
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fm_aigc?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      # ⚠️ 端口是 16379 不是 6379（Windows 保留端口段盖住了 6379，见排障手册）
      port: ${REDIS_PORT:16379}
      # ⚠️ 默认值必须与别的服务一致。写成 `${REDIS_PASSWORD:}` 这种空默认值
      #    会让连接报 NOAUTH，而且症状很隐蔽（M5 建 fm-data 时踩过：
      #    写入"成功了一半"，计数全是 0）
      password: ${REDIS_PASSWORD:123456}
      database: 0

  # ==================== RabbitMQ（M6-6：把 AI 指标发给数据中心） ====================
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    # ⚠️ AMQP 端口是 15673（15672 是管理台）—— 5672 被 Windows 保留端口段盖住了，
    #    与 Redis 16379 是同一个原因（见排障手册）
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.fitmind: debug
    # Spring AI 的请求日志会把整个 prompt 打出来，调试 RAG 时很有用，
    # 但它的量很大（每轮都一条完整 prompt），所以默认不开
    org.springframework.ai: info
