server:
  port: 8085
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: fm-search
  profiles:
    active: local

  # ==================== RabbitMQ ====================
  # 消费 fm-course 发出的课程上下架消息，同步 ES 索引。
  # 注意：必须写在已有 spring 块内——同一 YAML 文档里再写一个顶层 spring: 会触发
  #      DuplicateKeyException（M2-2a 已踩过）
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /

    # ==================== P0-3 生产端确认 ====================
    # ★ 缺了这两行，RabbitMqHelper 里传的 CorrelationData 只是个随机 id（没人接结果）：
    #   交换机不存在 / 路由键拼错时，消息被 broker 静默丢弃，业务代码零感知。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true            # ★ 没有它，上面的 publisher-returns 永远不会触发
    # ==================== P0-4 消费端重试与死信 ====================
    listener:
      simple:
        # ★ P0-4：抛异常不要无限重投（默认 true = 立刻重新入队 → 死循环，
        #   一条毒消息会把后面所有正常消息都堵住）
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3        # 1s / 2s 两轮退避后放弃，之后进死信队列
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000
        # 逐条处理：索引同步涉及跨服务调用（Feign 拉课程数据），并发高了容易压垮 fm-course；
        # 而且同一课程重复消费要能被幂等吸收，串行更简单可靠。
        concurrency: 1
        prefetch: 1

# ==================== 业务配置 ====================
fm:
  auth:
    resource:
      # 开启登录拦截（与网关形成双重防护，直连服务端口时同样受保护）
      enable: true
      includeLoginPaths:
        # ⚠️ 搜索是公开的——游客也要能逛课程，所以 /courses/** 不在这里
        - /interests/**
        - /recommend/**
      excludeLoginPaths:
        # 内部批量上下架索引的接口，由服务间调用（无 token）
        - /courses/up
        - /courses/down
        - /health

# ==================== Elasticsearch ====================
elasticsearch:
  # ⚠️ 这里写宿主机地址 9201（容器内是 9200，映射到宿主机 9201，因为 9200 被占用）。
  #    将来部署到容器内时换成 http://fm-es:9200。
  host: ${ES_HOST:127.0.0.1}
  port: ${ES_PORT_NUM:9201}
  index: ${ES_COURSE_INDEX:fitmind_course}

# ==================== 本地开发环境 ====================
---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    openfeign:
      # ★ P0-5：没有这一行，fm-api 里的 7 个 fallbackFactory 永远不会被触发
      #   （OpenFeign 的 fallback 只在 CircuitBreaker 开启时生效）。
      #   参数见 fm-api 的 FeignCircuitBreakerAutoConfiguration，不在这里重复。
      circuitbreaker:
        enabled: true
      # 2026-11-05 补：Feign 默认 readTimeout=60s —— 下游一挂，每次调用白占线程 60 秒
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        group: DEFAULT_GROUP
        namespace: public
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fm_search?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=2000&socketTimeout=10000
    username: root
    password: ${DB_PASSWORD:1234}

# ==================== MyBatis-Plus ====================
# 只用于 interests（用户兴趣）表，索引数据本身全在 ES
mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: input
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    # ★ P0-8：级别改成可注入 —— 生产用 FM_LOG_LEVEL=info 即可降级，
    #   不必改 16 份配置再重启。注意 logging.level.* 在 logback 配置之后生效，
    #   所以改 logback-spring.xml 里的 <logger> 是无效的，改这里才有效。
    com.fitmind: ${FM_LOG_LEVEL:debug}
