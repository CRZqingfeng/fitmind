server:
  port: 8088
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: fm-trade
  profiles:
    active: local

  # ==================== RabbitMQ ====================
  # M4-1 只声明交换机（生产方声明交换机、消费方声明队列）
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /

# ==================== 业务配置 ====================
fm:
  auth:
    resource:
      # ★ 管理端（后台）鉴权：/admin/** 要求管理员身份。
      #   M6-7 起拦截器由 fm-auth-resource-sdk 统一提供（此前 5 个服务各有一份副本，
      #   每份都要靠"记得写 .order(2)"才正确，已因此踩过一次坑）。
      #   ⚠️ order 由 SDK 保证，业务服务不需要、也不应该再自己注册。
      admin:
        enabled: true
      enable: true
      includeLoginPaths:
        # 购物车与订单都是"我的"，必须知道当前用户是谁
        - /carts/**
        - /orders/**
      excludeLoginPaths:
        - /health

# ==================== 交易业务参数 ====================
trade:
  cart:
    # 购物车最多放几门课（防刷，常见实现也是 10）
    max-course-amount: 10
  order:
    # 下单后多少分钟未支付自动关闭
    pay-over-minutes: 30
    # 兜底扫描的宽限分钟数：只扫「创建时间早于 now - (payOver + grace)」的订单。
    # 比正常超时多留一截，避免正常到期的订单被延迟队列和兜底扫描同时处理
    timeout-scan-grace-minutes: 5
    # 单次任务最多处理多少笔（防止一轮跑太久、失败影响面过大）
    timeout-cancel-batch: 100

# ==================== XXL-JOB 执行器 ====================
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:9090/xxl-job-admin}
    accessToken: ${XXL_JOB_TOKEN:default_token}
    executor:
      appname: fm-trade
      # ⚠️ 执行器通讯端口每个服务必须不同（learning 9995 / media 9996 / remark 9997）
      port: ${XXL_EXECUTOR_PORT:9998}
      logPath: ./logs/xxl-job/fm-trade
      logRetentionDays: 7

# ==================== 本地开发环境 ====================
---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    openfeign:
      # ★ 2026-11-05 补：Feign 默认 readTimeout=60s —— 下游一挂，每次调用白占线程 60 秒。
      #   这里设 5s，必须小于本服务对外接口的 SLA，否则"下游超时"会晚于"上游自我保护"。
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        group: DEFAULT_GROUP
        namespace: public
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fm_trade?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=2000&socketTimeout=10000
    username: root
    password: 1234
    hikari:
      # ★ 2026-11-05 补：Hikari 的 connectionTimeout 只管"从池里拿连接的等待"。
      #   ⚠️ socketTimeout 不是 HikariConfig 的属性（javap 核实 setter 清单里没有 setSocketTimeout），
      #   写在 hikari 下会被静默忽略 —— 它必须放到 JDBC URL 里（见上面 url 行的 socketTimeout）。
      connection-timeout: 3000
      maximum-pool-size: 10
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:16379}
      password: 123456
      database: 0

# ==================== MyBatis-Plus ====================
mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.fitmind: debug
