server:
  port: 8093
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: fm-data
  profiles:
    active: local

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /

    # ==================== P0-3 生产端确认 ====================
    # ★ 缺了这两行，RabbitMqHelper 里传的 CorrelationData 只是个随机 id（没人接结果）：
    #   交换机不存在 / 路由键拼错时，消息被 broker 静默丢弃，业务代码零感知。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true            # ★ 没有它，上面的 publisher-returns 永远不会触发
    # ==================== P0-4 消费端重试与死信 ====================
    # ★ 数据中心不需要生产者确认：统计少一条不影响业务，
    #   但消费失败必须能被发现（靠日志），所以不开自动删除队列
    listener:
      simple:
        # ★ P0-4：抛异常不要无限重投（默认 true = 立刻重新入队 → 死循环）
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 2        # 保留原值：统计类消息重试 2 次就够了
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000

  data:
    redis:
      # ⚠️ 注意端口是 16379 不是 6379（Windows 保留端口段盖住了 6379）
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      # ⚠️ 默认值必须与 docker 里的 redis 密码一致（其它服务都是硬编码 123456）。
      #    我第一版写成 `${REDIS_PASSWORD:}`（空默认值），而 REDIS_PASSWORD 这个环境变量
      #    在宿主机上根本没导出 → 连上去直接 NOAUTH。
      #    症状很有迷惑性：**去重表写进去了，但计数全是 0** ——
      #    因为 dedup 的 insert 成功了，紧接着的 HINCRBY 抛异常被 safe() 吞掉。
      password: ${REDIS_PASSWORD:123456}
      database: 0

fm:
  auth:
    resource:
      # ★ 管理端（后台）鉴权：/admin/** 要求管理员身份。
      #   M6-7 起拦截器由 fm-auth-resource-sdk 统一提供（此前 5 个服务各有一份副本，
      #   每份都要靠"记得写 .order(2)"才正确，已因此踩过一次坑）。
      #   ⚠️ order 由 SDK 保证，业务服务不需要、也不应该再自己注册。
      admin:
        enabled: true
      enable: true
      includeLoginPaths:
        # 数据中心只服务管理端：运营看板
        - /admin/**
      excludeLoginPaths:
        - /health

# ==================== 数据中心业务参数 ====================
data:
  # Redis 日计数的 key 过期时间（小时）。
  # 为什么不是不过期：定时落库任务会清掉已落库的 key，
  # 但万一任务挂了，不能让这些计数永久占着内存 —— 留 72 小时足够人工发现并补跑。
  counter-ttl-hours: 72
  # 销量榜 Top N
  top-n: 10

# ==================== XXL-JOB 执行器（定时落库） ====================
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:9090/xxl-job-admin}
    accessToken: ${XXL_JOB_TOKEN:default_token}
    executor:
      appname: fm-data
      port: ${XXL_EXECUTOR_PORT:10002}
      logPath: ./logs/xxl-job/fm-data
      logRetentionDays: 7

---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    openfeign:
      # ★ P0-5：没有这一行，fm-api 里的 7 个 fallbackFactory 永远不会被触发
      #   （OpenFeign 的 fallback 只在 CircuitBreaker 开启时生效）。
      #   参数见 fm-api 的 FeignCircuitBreakerAutoConfiguration，不在这里重复。
      circuitbreaker:
        enabled: true
      # 2026-11-05 补：Feign 默认 readTimeout=60s —— 下游一挂，每次调用白占线程 60 秒
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        group: DEFAULT_GROUP
        namespace: public
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fm_data?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=2000&socketTimeout=10000
    username: root
    password: 1234

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    # ★ P0-8：级别改成可注入 —— 生产用 FM_LOG_LEVEL=info 即可降级，
    #   不必改 16 份配置再重启。注意 logging.level.* 在 logback 配置之后生效，
    #   所以改 logback-spring.xml 里的 <logger> 是无效的，改这里才有效。
    com.fitmind: ${FM_LOG_LEVEL:debug}
