server:
  port: 8087
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: fm-remark
  profiles:
    active: local

  # ==================== RabbitMQ ====================
  # 点赞数变更 → 业务方（fm-learning）覆盖更新 liked_times
  # 注意：必须写在已有 spring 块内（同一 YAML 文档里再写一个顶层 spring: 会触发 DuplicateKeyException）
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /

    # ==================== P0-3 生产端确认 ====================
    # ★ 缺了这两行，RabbitMqHelper 里传的 CorrelationData 只是个随机 id（没人接结果）：
    #   交换机不存在 / 路由键拼错时，消息被 broker 静默丢弃，业务代码零感知。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true            # ★ 没有它，上面的 publisher-returns 永远不会触发
    # ==================== P0-4 消费端重试与死信 ====================
    listener:
      simple:
        # ★ 默认是 true —— 抛异常就立刻重新入队，一条毒消息能把整个队列永久堵死
        default-requeue-rejected: false
        prefetch: 20             # 一次只拉 20 条，慢消费者不会把堆吃满
        retry:
          enabled: true
          max-attempts: 3        # 1s / 2s 两轮退避后放弃
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000

# ==================== 业务配置 ====================
fm:
  auth:
    resource:
      enable: true
      includeLoginPaths:
        # 点赞与查点赞状态都需要登录（点赞要写当前用户，查状态要知道"我"是谁）
        - /remarks/likes
        - /remarks/likes/**
      excludeLoginPaths:
        # 【内部】故障恢复用：从 DB 重建 Redis 计数，由运维/脚本触发，不带 token
        - /remarks/likes/rebuild
        - /health

# ==================== XXL-JOB 执行器 ====================
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:9090/xxl-job-admin}
    accessToken: ${XXL_JOB_TOKEN:default_token}
    executor:
      appname: fm-remark
      # ⚠️ 执行器通讯端口每个服务必须不同（learning 9995 / media 9996）
      port: ${XXL_EXECUTOR_PORT:9997}
      logPath: ./logs/xxl-job/fm-remark
      logRetentionDays: 7

# ==================== 点赞同步参数 ====================
remark:
  likes:
    # 单批弹出多少条（太小 → MQ 消息多；太大 → 单轮耗时长、失败影响面大）
    sync-batch-size: 30
    # 一次任务最多跑几轮（积压时连续排空，避免"每 20 秒只能同步 30 条"被追不上）
    sync-max-rounds: 10

# ==================== 本地开发环境 ====================
---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    openfeign:
      # ★ P0-5：没有这一行，fm-api 里的 7 个 fallbackFactory 永远不会被触发
      #   （OpenFeign 的 fallback 只在 CircuitBreaker 开启时生效）。
      #   参数见 fm-api 的 FeignCircuitBreakerAutoConfiguration，不在这里重复。
      circuitbreaker:
        enabled: true
      # 2026-11-05 补：Feign 默认 readTimeout=60s —— 下游一挂，每次调用白占线程 60 秒
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        group: DEFAULT_GROUP
        namespace: public
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fm_remark?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=2000&socketTimeout=10000
    username: root
    password: ${DB_PASSWORD:1234}
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:123456}
      database: 0

# ==================== MyBatis-Plus ====================
mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    # ★ P0-8：级别改成可注入 —— 生产用 FM_LOG_LEVEL=info 即可降级，
    #   不必改 16 份配置再重启。注意 logging.level.* 在 logback 配置之后生效，
    #   所以改 logback-spring.xml 里的 <logger> 是无效的，改这里才有效。
    com.fitmind: ${FM_LOG_LEVEL:debug}
